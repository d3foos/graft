name: GRAFT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            strict-equiv: "false"
          - os: ubuntu-latest
            python-version: "3.12"
            strict-equiv: "true"
          - os: ubuntu-latest
            python-version: "3.13"
            strict-equiv: "false"
          - os: macos-latest
            python-version: "3.12"
            strict-equiv: "false"
          - os: windows-latest
            python-version: "3.12"
            strict-equiv: "false"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PHP & Ruby on strict Linux leg
        if: matrix.strict-equiv == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli ruby

      - name: Initialize, reindex, and verify poison gate
        shell: bash
        run: |
          python tools/tdb.py init
          python tools/tdb.py reindex
          STATS_OUT=$(python tools/tdb.py stats)
          echo "$STATS_OUT"
          echo "$STATS_OUT" | grep -q "poison gate: OK"

      - name: Verify tamper-evident manifest
        run: python tools/tdb.py lock-sources --verify

      - name: Verify equivalence tables
        run: |
          if [ "${{ matrix.strict-equiv }}" = "true" ]; then
            python tools/tdb.py verify-table --strict
          else
            python tools/tdb.py verify-table
          fi
        shell: bash

      - name: Run full unit and packaging test suite
        run: python tests/run_tests.py

      - name: Verify PEP 621 console entrypoints
        shell: bash
        run: |
          python -m pip install --no-deps --no-build-isolation .
          graft-tdb --root . stats | grep -q "poison gate: OK"

      - name: Verify Desktop & plugin ZIP bundle build
        shell: bash
        run: |
          python scripts/build-bundles.py --out dist
          ls -lh dist/
